<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athlead</title>

    <style>
      /* ------------------------- RESET ------------------------- */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        overflow-x: hidden;
      }

      a {
        text-decoration: none;
      }

      /* -------------------------------------------------------------
         HEADER
      ------------------------------------------------------------- */

      .header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 70px;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        z-index: 1000;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .logo {
        font-size: 24px;
        font-weight: 800;
        cursor: pointer;
      }

      .nav-links {
        display: flex;
        gap: 20px;
      }

      .nav-links a {
        color: white;
        font-size: 16px;
        opacity: 0.85;
        transition: 0.2s;
      }

      .nav-links a:hover {
        opacity: 1;
      }

      /* Botón menú móvil */
      .menu-toggle {
        display: none;
        background: none;
        border: none;
        color: white;
        font-size: 24px;
        cursor: pointer;
      }

      /* Buscador (solo desktop) */
      .header-search {
        display: flex;
        align-items: center;
      }

      .header-search-input {
        padding: 6px 12px;
        border-radius: 6px;
        border: none;
        outline: none;
      }

      @media (max-width: 850px) {
        .nav-links {
          position: absolute;
          top: 70px;
          right: 0;
          background: black;
          width: 100%;
          display: none;
          flex-direction: column;
          padding: 20px;
          text-align: center;
        }

        .menu-toggle {
          display: block;
        }

        .header-search {
          display: none;
        }
      }

      /* -------------------------------------------------------------
         HERO CON VIDEO DE FONDO
      ------------------------------------------------------------- */

      .hero-section {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #000;
        padding: 120px 20px 60px;
      }

      .hero-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.45;
        z-index: -2;
      }

      .hero-content {
        z-index: 2;
        max-width: 900px;
      }

      .hero-section h1 {
        font-size: clamp(3rem, 4vw + 1rem, 5rem);
        font-weight: 700;
        margin-bottom: 16px;
      }

      .hero-subtitle {
        font-size: clamp(1.2rem, 2vw, 1.8rem);
        opacity: 0.85;
        margin-bottom: 32px;
        font-style: italic;
      }

      .hero-buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .btn-cta,
      .btn-secondary {
        padding: 12px 36px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 1rem;
        transition: 0.2s ease;
      }

      .btn-cta {
        background: white;
        color: black;
      }

      .btn-secondary {
        border: 2px solid white;
        color: white;
      }

      .btn-secondary:hover,
      .btn-cta:hover {
        transform: translateY(-2px);
        opacity: 0.9;
      }

      /* -------------------------------------------------------------
         SIGNUP FORM (FORMULARIO GRANDE CON FOTO DE FONDO)
      ------------------------------------------------------------- */

      .signup-section {
        padding: 100px 20px;
        text-align: center;
        position: relative;

        background-image: linear-gradient(
            rgba(0, 0, 0, 0.7),
            rgba(0, 0, 0, 0.7)
          ),
          url("images/signup-bg.jpg");
        background-size: cover;
        background-position: center;
      }

      .signup-form {
        background: rgba(255, 255, 255, 0.07);
        padding: 40px;
        border-radius: 12px;
        max-width: 650px;
        margin: auto;
        backdrop-filter: blur(8px);
      }

      .signup-form h2 {
        margin-bottom: 20px;
        font-size: 2rem;
      }

      .form-group {
        text-align: left;
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        opacity: 0.9;
        margin-bottom: 4px;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: none;
      }

      .submit-btn {
        width: 100%;
        padding: 14px;
        background: white;
        color: black;
        border-radius: 10px;
        font-weight: 700;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.2s;
      }

      .submit-btn:hover {
        opacity: 0.85;
      }

      /* -------------------------------------------------------------
         FOOTER
      ------------------------------------------------------------- */

      footer {
        margin-top: 60px;
        text-align: center;
        padding: 40px;
        opacity: 0.7;
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="logo" id="logo">ATHLEAD</div>

      <button class="menu-toggle" id="menuToggle">☰</button>

      <nav class="nav-links">
        <a href="#who-we-are">Quiénes somos</a>
        <a href="#how-it-works">Cómo funciona</a>
        <a href="#signup">Registro</a>
      </nav>

      <!-- Buscador desktop -->
      <form class="header-search" action="https://www.google.com/search" method="GET" target="_blank">
        <input
          type="text"
          name="q"
          class="header-search-input"
          placeholder="Buscar..."
        />
      </form>
    </header>

    <!-- HERO -->
    <section class="hero-section" id="home">
      <video class="hero-video" autoplay muted loop playsinline>
        <source src="videos/hero.mp4" type="video/mp4" />
      </video>

      <div class="hero-content">
        <h1>En el fútbol no se gana con dinero. Se gana con talento.</h1>
        <p class="hero-subtitle">Deja que tu talento hable por ti.</p>

        <div class="hero-buttons">
          <a href="#signup" class="btn-cta">Únete a la lista de espera</a>
          <a href="#who-we-are" class="btn-secondary">¿Quiénes somos?</a>
        </div>
      </div>
    </section>

    <!-- SIGNUP FORM -->
    <section class="signup-section" id="signup">
      <form class="signup-form">
        <h2>Únete a Athlead</h2>

        <div class="form-group">
          <label>Nombre completo</label>
          <input type="text" required />
        </div>

        <div class="form-group">
          <label>Edad</label>
          <input type="number" required />
        </div>

        <div class="form-group">
          <label>Posición</label>
          <select>
            <option>Delantero</option>
            <option>Extremo</option>
            <option>Mediocentro</option>
            <option>Defensa</option>
            <option>Portero</option>
          </select>
        </div>

        <button class="submit-btn">Registrarme</button>
      </form>
    </section>

    <footer>
      © 2025 Athlead. Todos los derechos reservados.
    </footer>

    <script>
      // Menu móvil
      const menuToggle = document.getElementById("menuToggle");
      const navLinks = document.querySelector(".nav-links");

      menuToggle.onclick = () => {
        navLinks.style.display =
          navLinks.style.display === "flex" ? "none" : "flex";
      };
    </script>
  </body>
</html>
