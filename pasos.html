  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #101219;
      --border-soft: rgba(255, 255, 255, 0.14);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.7);
      --accent: #ffffff;
      --accent-alt: #4ecdc4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -40%;
      background:
        radial-gradient(circle at 10% 0%, rgba(78, 205, 196, 0.16) 0, transparent 50%),
        radial-gradient(circle at 90% 100%, rgba(255, 255, 255, 0.06) 0, transparent 55%);
      opacity: 1;
      pointer-events: none;
      z-index: -1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ===== HEADER PRINCIPAL ===== */

    .header {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translate(-50%, 0);
      width: min(1100px, 92%);
      padding: 20px 28px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 22px 45px rgba(0, 0, 0, 0.65);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      transition: transform 0.6s ease-in-out;
    }

    .header.hide-header {
      transform: translate(-50%, -180%);
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.16em;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 16px;
    }

    .nav-links a {
      opacity: 0.8;
      padding: 4px 0;
      border-bottom: 1px solid transparent;
      transition: opacity 0.2s, border-bottom-color 0.2s;
    }

    .nav-links a:hover {
      opacity: 1;
      border-bottom-color: rgba(255, 255, 255, 0.8);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Selector de idioma */
    .lang-switcher {
      position: relative;
    }

    .lang-current {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.45);
      color: #ffffff;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .lang-flag {
      font-size: 16px;
      line-height: 1;
    }

    .lang-label {
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .lang-arrow {
      font-size: 10px;
      opacity: 0.8;
    }

    .lang-menu {
      position: absolute;
      right: 0;
      top: 110%;
      min-width: 160px;
      background: #000000;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.8);
      padding: 6px;
      display: none;
      z-index: 1200;
    }

    .lang-menu.open {
      display: block;
    }

    .lang-menu button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 13px;
      cursor: pointer;
      border-radius: 999px;
      text-align: left;
    }

    .lang-menu button:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: #ffffff;
      font-size: 24px;
      cursor: pointer;
    }

    .mobile-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 260px;
      height: 100vh;
      background: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(14px);
      z-index: 900;
      padding: 80px 24px 24px;
      transition: right 0.3s ease;
    }

    .mobile-menu.active {
      right: 0;
    }

    .mobile-menu-links {
      display: flex;
      flex-direction: column;
      gap: 18px;
      font-size: 16px;
    }

    .mobile-menu-links a {
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* Layout general de la página */
    .page-shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 120px 16px 72px; /* espacio para la barra fija */
    }

    /* Botón de volver dentro del contenido */
    .mini-back {

      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      text-decoration: none;
      color: #fff;
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.6);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease,

      margin-bottom: 20px;
    }

    .mini-back span {
      font-size: 14px;
      line-height: 1;
    }

    .mini-back:hover {
      background: #ffffff;
      color: #000;
      border-color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
    }

    /* Intro */
    .section-kicker {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 11px;
      opacity: 0.7;
      margin-bottom: 6px;
    }

    h1 {
      font-size: clamp(2.1rem, 3.2vw, 2.7rem);
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }

    .page-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 24px;
      max-width: 640px;
      line-height: 1.7;
    }

    .page-tagline {
      font-size: 13px;
      color: var(--accent-alt);
      margin-bottom: 32px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    /* Steps layout */
    .steps-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .step-card {
      position: relative;
      background: radial-gradient(circle at 0 0, rgba(78, 205, 196, 0.16), transparent 55%),
        var(--bg-card);
      border-radius: 24px;
      padding: 24px 22px 26px;
      border: 1px solid var(--border-soft);
      overflow: hidden;
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease,
        background 0.22s ease;
    }

    .step-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 1px solid transparent;
      background: linear-gradient(135deg, rgba(78, 205, 196, 0.7), transparent)
        border-box;
      mix-blend-mode: soft-light;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .step-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 26px 60px rgba(0, 0, 0, 0.9);
      border-color: rgba(255, 255, 255, 0.24);
    }

    .step-card:hover::after {
      opacity: 0.45;
    }

    .step-chip {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .step-chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.5);
    }
